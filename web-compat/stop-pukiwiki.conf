# php2shell (CVE-2026-109618 / CVE-2026-109619) emergency response.
#
# This image runs PHP 8.1 (EOL), which gets no upstream fix, so PukiWiki
# instances that run PHP for unauthenticated requests are stopped. Wikis whose
# Apache-level Basic auth covers every method are left running.
#
# A server-level Redirect is inherited by the VirtualHost and evaluated at
# URL-translation time, i.e. before UserDir, .htaccess and PHP, so the request
# body never reaches PHP. Matching is per path segment (/~u/wiki does not match
# /~u/wiki2). Symlinked aliases of a stopped wiki must be listed as well.

Alias /hpcs-pukiwiki-stopped.html /var/www/hpcs-maintenance/pukiwiki-stopped.html
<Directory /var/www/hpcs-maintenance>
    Require all granted
</Directory>
ErrorDocument 503 /hpcs-pukiwiki-stopped.html

# PHP answers without authentication.
Redirect 503 /experiment/test
Redirect 503 /~aida/wiki
Redirect 503 /~banzai/wiki
Redirect 503 /~fujii/exp
Redirect 503 /~fujii/hoge
Redirect 503 /~hanawa/pukiwiki
Redirect 503 /~hanawa/pukiwiki-1.4.7_notb_utf8
